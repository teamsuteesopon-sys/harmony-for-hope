services:
  - type: web
    name: harmony-for-hope-1
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT server:app
    plan: starter
    envVars:
      - key: DB_PATH
        value: /data/bids.db
    disk:
      name: auction-data
      mountPath: /data
      sizeGB: 1
